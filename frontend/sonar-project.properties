# SonarQube project configuration
sonar.projectKey=demo-quant-trading-frontend
sonar.projectName=Demo Quantitative Trading Frontend
sonar.projectVersion=1.0.0

# Source and test directories
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
sonar.test.exclusions=**/*.d.ts,**/node_modules/**,**/.next/**

# Language settings
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Code coverage exclusions
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/*.stories.tsx,**/*.d.ts

# Duplicate detection exclusions
sonar.cpd.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Analysis settings
sonar.sourceEncoding=UTF-8
sonar.host.url=http://localhost:9000

# Quality gates
sonar.qualitygate.wait=true

# Additional analysis parameters
sonar.javascript.file.suffixes=.js,.jsx,.ts,.tsx
sonar.typescript.file.suffixes=.ts,.tsx