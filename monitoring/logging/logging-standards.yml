# Structure Logging Standards and Configuration
# 定义统一的结构化日志标准和格式

# 日志级别定义
log_levels:
  CRITICAL: 50  # 系统级严重错误，可能导致系统崩溃
  ERROR: 40     # 应用级错误，但系统仍可继续运行
  WARNING: 30   # 警告信息，潜在问题
  INFO: 20      # 一般信息，记录重要的业务流程
  DEBUG: 10     # 调试信息，详细的执行信息

# 日志格式标准
log_format:
  timestamp: "iso8601"  # ISO 8601 格式时间戳
  level: "string"       # 日志级别字符串
  message: "string"     # 日志消息内容
  logger: "string"      # 日志记录器名称
  module: "string"      # 模块名称
  function: "string"    # 函数名称
  line: "integer"       # 代码行号

  # 结构化字段
  trace_id: "string"    # 分布式追踪ID
  span_id: "string"     # Span ID
  user_id: "string"     # 用户ID
  session_id: "string"  # 会话ID
  request_id: "string"  # 请求ID

  # 业务上下文
  operation: "string"   # 操作名称
  resource: "string"    # 资源标识
  status: "string"      # 操作状态
  duration: "float"     # 操作耗时(毫秒)

  # 技术上下文
  service: "string"     # 服务名称
  version: "string"     # 服务版本
  environment: "string" # 环境标识
  hostname: "string"    # 主机名

  # 错误上下文
  error_type: "string"  # 错误类型
  error_code: "string"  # 错误代码
  stack_trace: "string" # 堆栈跟踪

  # 自定义字段
  tags: "array"         # 标签数组
  metadata: "object"    # 元数据对象

# 敏感信息过滤规则
sensitive_data_filters:
  # 常见敏感字段
  fields:
    - "password"
    - "passwd"
    - "secret"
    - "token"
    - "key"
    - "auth"
    - "credential"
    - "session"
    - "cookie"
    - "authorization"
    - "bearer"
    - "api_key"
    - "access_token"
    - "refresh_token"

  # 敏感信息模式
  patterns:
    - "password[:=]\\s*[\"']?[\\w\\-@#$%^&*+]{8,}[\"']?"
    - "token[:=]\\s*[\"']?[\\w\\-\\.]{20,}[\"']?"
    - "key[:=]\\s*[\"']?[A-Za-z0-9+/]{32,}[\"']?"
    - "bearer\\s+[A-Za-z0-9\\-._~+\\/]+=*"
    - "basic\\s+[A-Za-z0-9+/=]+"

  # 替换策略
  replacement:
    type: "mask"
    pattern: "[REDACTED]"
    keep_length: false  # 是否保持原长度

# 日志分类标准
log_categories:
  # 应用日志
  application:
    description: "应用程序核心业务逻辑日志"
    fields: ["operation", "status", "duration", "user_id"]
    examples:
      - 用户操作记录
      - 业务流程执行
      - 数据处理结果

  # 安全日志
  security:
    description: "安全相关事件和审计日志"
    fields: ["user_id", "ip_address", "user_agent", "action", "resource"]
    examples:
      - 用户登录/登出
      - 权限检查
      - 安全事件

  # 性能日志
  performance:
    description: "性能监控和性能分析日志"
    fields: ["operation", "duration", "trace_id", "span_id", "memory_usage"]
    examples:
      - API响应时间
      - 数据库查询时间
      - 资源使用情况

  # 错误日志
  error:
    description: "错误和异常日志"
    fields: ["error_type", "error_code", "stack_trace", "trace_id"]
    examples:
      - 应用异常
      - 系统错误
      - 外部服务错误

  # 审计日志
  audit:
    description: "审计追踪和合规日志"
    fields: ["user_id", "action", "resource", "timestamp", "result"]
    examples:
      - 数据修改记录
      - 配置变更
      - 敏感操作

  # 系统日志
  system:
    description: "系统级别日志和基础设施日志"
    fields: ["service", "hostname", "pid", "memory_usage", "cpu_usage"]
    examples:
      - 服务启动/停止
      - 系统资源监控
      - 依赖服务状态

# 日志保留策略
retention_policy:
  # 生产环境
  production:
    debug: "7 days"      # DEBUG 日志保留 7 天
    info: "30 days"      # INFO 日志保留 30 天
    warning: "90 days"   # WARNING 日志保留 90 天
    error: "1 year"      # ERROR 日志保留 1 年
    critical: "3 years"  # CRITICAL 日志保留 3 年

  # 测试环境
  testing:
    debug: "3 days"
    info: "7 days"
    warning: "14 days"
    error: "30 days"
    critical: "90 days"

  # 开发环境
  development:
    debug: "1 day"
    info: "3 days"
    warning: "7 days"
    error: "14 days"
    critical: "30 days"

# 日志聚合配置
aggregation:
  # 批处理设置
  batch_size: 100
  batch_timeout: "5s"
  max_retries: 3

  # 压缩设置
  compression:
    enabled: true
    algorithm: "gzip"
    level: 6

  # 传输设置
  transport:
    protocol: "http"
    endpoint: "http://log-aggregator:8080/logs"
    headers:
      "Content-Type": "application/json"
      "X-Log-Source": "quant-trading-platform"

# 日志监控规则
monitoring_rules:
  # 错误率监控
  error_rate:
    threshold: 0.05  # 5%
    window: "5m"
    severity: "warning"

  # 关键操作监控
  critical_operations:
    operations:
      - "user_login"
      - "strategy_calculation"
      - "data_export"
    max_duration: "30s"
    severity: "warning"

  # 安全事件监控
  security_events:
    events:
      - "failed_login"
      - "unauthorized_access"
      - "privilege_escalation"
    threshold: 10  # 每分钟最多10次
    window: "1m"
    severity: "critical"

# 日志质量标准
quality_standards:
  # 完整性要求
  completeness:
    required_fields: ["timestamp", "level", "message", "logger"]
    recommended_fields: ["trace_id", "operation", "user_id"]

  # 一致性要求
  consistency:
    timestamp_format: "iso8601"
    level_naming: "uppercase"
    field_naming: "snake_case"

  # 可读性要求
  readability:
    message_max_length: 1000
    avoid_special_chars: true
    use_meaningful_names: true

  # 性能要求
  performance:
    max_log_size: "10KB"
    serialization_time: "< 1ms"
    network_transmission: "< 100ms"

# 环境特定配置
environments:
  production:
    level: "INFO"
    structured: true
    console_output: false
    file_output: true
    remote_logging: true

  staging:
    level: "DEBUG"
    structured: true
    console_output: true
    file_output: true
    remote_logging: true

  development:
    level: "DEBUG"
    structured: false
    console_output: true
    file_output: false
    remote_logging: false

# 日志标签规范
tags:
  # 服务标签
  service:
    - "api-server"
    - "web-frontend"
    - "data-processor"
    - "strategy-engine"

  # 模块标签
  module:
    - "authentication"
    - "authorization"
    - "database"
    - "cache"
    - "external-api"

  # 业务标签
  business:
    - "user-management"
    - "strategy-analysis"
    - "data-fetching"
    - "report-generation"

  # 技术标签
  technical:
    - "http-request"
    - "database-query"
    - "cache-operation"
    - "background-job"