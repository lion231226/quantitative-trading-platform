[default]
# 应用配置
app_name = 量化交易平台一键启动器
app_version = 1.0.0
debug = false

# 端口配置
redis_port = 6379
backend_port = 8000
frontend_port = 3000

# 超时配置
service_start_timeout = 120
health_check_timeout = 30
network_check_timeout = 10

# 重试配置
max_retry_count = 3
retry_delay = 5

[paths]
# 项目路径配置
project_root = ..
frontend_path = ../frontend
backend_path = ../backend
logs_path = ./logs
temp_path = ./temp

[dependencies]
# Python依赖
min_python_version = 3.8
required_python_packages = psutil,rich,requests

# Node.js依赖
min_node_version = 18.0.0
npm_install_timeout = 300

# 系统依赖
redis_required = true
git_required = true

[platform]
# 平台特定配置
platform = auto  # auto, windows, macos, linux
architecture = auto  # auto, x64, arm64

[features]
# 功能开关
auto_install_dependencies = true
auto_cleanup_ports = true
create_desktop_shortcut = true
auto_open_browser = true

offline_mode = false
verbose_logging = false
progress_animation = true

[advanced]
# 高级配置
parallel_dependency_install = false
cache_downloads = true
backup_existing_configs = true
verify_installations = true