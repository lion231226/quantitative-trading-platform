# Backend API Service Configuration
# Generated for one-click launcher backend service startup

# Service Configuration
service:
  name: "backend_api"
  host: "localhost"
  port: 8000
  backend_type: "fastapi"  # fastapi, flask

  # Process Management
  working_directory: "backend"
  startup_script: "main.py"
  python_executable: "python"

  # Timing Configuration
  startup_timeout: 30
  health_check_interval: 5
  max_retries: 3

  # Logging
  log_level: "INFO"
  log_file: "logs/backend.log"

  # Environment
  env_file: ".env"
  environment: "development"

# API Endpoints
endpoints:
  health: "/health"
  docs: "/api/docs"
  metrics: "/metrics"

  # Health check configuration
  health_check:
    enabled: true
    interval: 30  # seconds
    timeout: 5    # seconds
    expected_status: 200

  # Documentation configuration
  docs_check:
    enabled: true
    timeout: 5    # seconds
    expected_status: 200

# Database Configuration
database:
  # Redis Configuration
  redis:
    host: "localhost"
    port: 6379
    password: null
    db: 0
    connection_timeout: 5
    max_connections: 10

  # PostgreSQL Configuration
  postgresql:
    host: "localhost"
    port: 5432
    database: "quantdb"
    username: "postgres"
    password: null
    connection_timeout: 10
    max_connections: 20
    pool_size: 5

# Performance Configuration
performance:
  # Response time thresholds (seconds)
  response_time_thresholds:
    health_endpoint: 2.0
    docs_endpoint: 3.0
    api_endpoints: 5.0

  # Monitoring
  enable_monitoring: true
  monitoring_interval: 60  # seconds

  # Auto-restart configuration
  auto_restart:
    enabled: true
    max_attempts: 3
    delay: 10  # seconds
    failure_threshold: 3  # consecutive failures

# Security Configuration
security:
  # CORS configuration
  cors:
    enabled: true
    origins: ["http://localhost:3000", "http://127.0.0.1:3000"]
    methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
    headers: ["*"]

  # API rate limiting
  rate_limiting:
    enabled: false
    requests_per_minute: 60
    burst_size: 10

# Development Configuration
development:
  # Debug mode
  debug: true

  # Hot reload
  hot_reload: true

  # Test data
  load_test_data: false

  # Development endpoints
  dev_endpoints:
    enabled: true
    endpoints:
      - "/debug"
      - "/test"
      - "/reset"

# Production Configuration
production:
  # Debug mode
  debug: false

  # Hot reload
  hot_reload: false

  # Logging level
  log_level: "WARNING"

  # Performance optimization
  optimize_for_performance: true

  # Security hardening
  security_hardening: true

# Feature Flags
features:
  # API features
  api_versioning: true
  request_logging: true
  response_compression: true

  # Monitoring features
  metrics_collection: true
  health_detailed: true
  performance_tracking: true

  # Development features
  api_testing: true
  mock_data: false
  debug_endpoints: true

# External Services
external_services:
  # Third-party APIs
  third_party_apis:
    enabled: false
    timeout: 10
    retry_count: 3

  # Notification services
  notifications:
    enabled: false
    webhook_url: null
    email_config: null

# Backup and Recovery
backup:
  # Auto-backup configuration
  auto_backup:
    enabled: false
    interval: 24  # hours
    retention_days: 7

  # Recovery configuration
  recovery:
    auto_recovery: true
    max_recovery_attempts: 3
    recovery_delay: 30  # seconds