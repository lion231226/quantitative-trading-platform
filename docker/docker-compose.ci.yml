version: '3.8'

services:
  # Redis service with health check
  redis:
    image: redis:7-alpine
    container_name: ci-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

  # Database service (if needed)
  database:
    image: postgres:15-alpine
    container_name: ci-database
    environment:
      POSTGRES_DB: test_db
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d test_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # Application build service
  app-builder:
    build:
      context: .
      dockerfile: docker/Dockerfile.ci-optimized
      target: builder
      cache_from:
        - type=local,src=/tmp/.buildx-cache
      cache_to:
        - type=local,dest=/tmp/.buildx-cache
    container_name: ci-app-builder
    volumes:
      - ./frontend/.next:/app/frontend/.next
      - ./backend:/app/backend
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1
    depends_on:
      redis:
        condition: service_healthy
      database:
        condition: service_healthy

volumes:
  redis-data:
  postgres-data:
