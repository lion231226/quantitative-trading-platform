name: 代码覆盖率报告

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # 每周日凌晨2点运行
    - cron: '0 2 * * 0'

jobs:
  backend-coverage:
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置Python环境
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: 缓存Python依赖
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: 安装Python依赖
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -e .[dev,test]

    - name: 运行后端测试并生成覆盖率
      run: |
        cd backend
        python -m pytest \
          --cov=app \
          --cov-report=xml \
          --cov-report=html \
          --cov-report=json \
          --junit-xml=junit.xml \
          -v \
          tests/

    - name: 上传后端覆盖率到Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./backend/coverage.xml
        flags: backend
        name: backend-coverage
        fail_ci_if_error: false

    - name: 上传后端测试报告
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: backend-coverage
        path: |
          backend/htmlcov/
          backend/coverage.xml
          backend/coverage.json
          backend/junit.xml

  frontend-coverage:
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置Node.js环境
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: 安装前端依赖
      run: |
        cd frontend
        npm ci

    - name: 运行前端测试并生成覆盖率
      run: |
        cd frontend
        npm run test:coverage

    - name: 上传前端覆盖率到Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./frontend/coverage/lcov.info
        flags: frontend
        name: frontend-coverage
        fail_ci_if_error: false

    - name: 上传前端测试报告
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: frontend-coverage
        path: |
          frontend/coverage/
          frontend/junit.xml

  e2e-coverage:
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置Node.js环境
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: 安装依赖
      run: |
        cd frontend
        npm ci
        npx playwright install --with-deps

    - name: 安装Python依赖
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -e .

    - name: 启动服务
      run: |
        cd backend
        python -m uvicorn main:app &
        sleep 10

    - name: 运行E2E测试
      run: |
        cd frontend
        npx playwright test --reporter=json --reporter=html

    - name: 上传E2E测试报告
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: e2e-test-results
        path: |
          frontend/playwright-report/
          frontend/test-results/

  coverage-summary:
    runs-on: ubuntu-latest
    needs: [backend-coverage, frontend-coverage, e2e-coverage]
    if: always()

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置Python环境
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: 下载所有测试报告
      uses: actions/download-artifact@v3

    - name: 生成综合覆盖率报告
      run: |
        chmod +x scripts/coverage-report.sh
        ./scripts/coverage-report.sh

    - name: 生成覆盖率徽章
      run: |
        # 检查是否达到覆盖率标准
        COVERAGE_MET=true

        if [ -f "coverage-reports/backend/coverage.json" ]; then
          BACKEND_COVERAGE=$(python -c "
import json
with open('coverage-reports/backend/coverage.json') as f:
    data = json.load(f)
print(data['totals']['percent_covered'])
")

          if (( $(echo "$BACKEND_COVERAGE < 80" | bc -l) )); then
            COVERAGE_MET=false
          fi
        fi

        if [ -f "coverage-reports/frontend/coverage-summary.json" ]; then
          FRONTEND_COVERAGE=$(python -c "
import json
with open('coverage-reports/frontend/coverage-summary.json') as f:
    data = json.load(f)
print(data['total']['lines']['pct'])
")

          if (( $(echo "$FRONTEND_COVERAGE < 80" | bc -l) )); then
            COVERAGE_MET=false
          fi
        fi

        # 设置徽章颜色
        if [ "$COVERAGE_MET" = true ]; then
          BADGE_COLOR="brightgreen"
          BADGE_STATUS="passing"
        else
          BADGE_COLOR="red"
          BADGE_STATUS="failing"
        fi

        echo "coverage=${COVERAGE_MET}" >> $GITHUB_ENV

    - name: 上传综合报告
      uses: actions/upload-artifact@v3
      with:
        name: coverage-summary
        path: |
          coverage-reports/
          !coverage-reports/**/*.tmp

    - name: 评论PR（如果是PR）
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const path = require('path');

          // 查找最新的覆盖率报告
          const reportDir = 'coverage-reports';
          const files = fs.readdirSync(reportDir);
          const summaryFile = files.find(f => f.startsWith('coverage-summary-') && f.endsWith('.md'));

          if (summaryFile) {
            const summaryPath = path.join(reportDir, summaryFile);
            const summary = fs.readFileSync(summaryPath, 'utf8');

            // 提取关键信息
            const lines = summary.split('\n');
            let coverageInfo = '';

            for (const line of lines) {
              if (line.includes('总体覆盖率') || line.includes('总覆盖率')) {
                coverageInfo += line + '\n';
              }
            }

            // 创建评论
            const comment = `## 📊 代码覆盖率报告

${coverageInfo}

[查看详细报告](https://github.com/${{ context.repo.owner }}/${{ context.repo.repo }}/actions/runs/${{ github.run_id }})
            `;

            // 发送评论
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
          }

    - name: 检查覆盖率标准
      if: steps.coverage-summary.outputs.coverage == 'false'
      run: |
        echo "❌ 代码覆盖率未达到80%的标准"
        echo "请增加测试用例以提高覆盖率"
        exit 1

  security-scan:
    runs-on: ubuntu-latest
    needs: [backend-coverage, frontend-coverage]

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 运行安全扫描
      uses: securecodewarrior/github-action-add-sarif@v1
      with:
        sarif-file: 'security-scan-results.sarif'

    - name: 上传安全扫描结果
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: security-scan-results.sarif