name: Security Scan Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # 每天UTC 2:00运行安全扫描
    - cron: '0 2 * * *'

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependencies
      working-directory: ./frontend
      run: |
        npm install --package-lock-only
        npm ci

    - name: Create security reports directory
      working-directory: ./frontend
      run: mkdir -p security-reports

    - name: Run Security Audit
      working-directory: ./frontend
      id: audit
      run: |
        echo "🔍 Running security audit..."

        # 创建基础报告
        echo "# 📊 Security Scan Report" > security-reports/security-summary.md
        echo "Generated on: $(date)" >> security-reports/security-summary.md
        echo "" >> security-reports/security-summary.md

        # 运行npm audit并保存结果
        npm audit --json > security-reports/npm-audit-report.json 2>&1 || true
        npm audit >> security-reports/security-summary.md 2>&1 || echo "✅ No vulnerabilities found" >> security-reports/security-summary.md

        # 检查是否有漏洞
        if npm audit --audit-level moderate 2>&1 | grep -q "vulnerabilities found"; then
          echo "::set-output name=vulnerabilities_found::true"
          echo "❌ Vulnerabilities detected"
        else
          echo "::set-output name=vulnerabilities_found::false"
          echo "✅ No vulnerabilities detected"
        fi
      continue-on-error: true

    - name: Upload Security Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-report
        path: frontend/security-reports/
        retention-days: 30

    - name: Fail on High Severity Vulnerabilities
      working-directory: ./frontend
      if: steps.audit.outputs.vulnerabilities_found == 'true'
      run: |
        echo "🔍 Checking for high severity vulnerabilities..."
        npm audit --audit-level high
        if [ $? -ne 0 ]; then
          echo "❌ High severity vulnerabilities found - failing build"
          exit 1
        else
          echo "✅ No high severity vulnerabilities - build passes"
        fi