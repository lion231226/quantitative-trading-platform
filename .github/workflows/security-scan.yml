name: Security Scan Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # 每天UTC 2:00运行安全扫描
    - cron: '0 2 * * *'

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Create security reports directory
      working-directory: ./frontend
      run: mkdir -p security-reports

    - name: Run NPM Security Audit
      working-directory: ./frontend
      run: |
        echo "🔍 Running NPM Security Audit..."
        npm audit --json > security-reports/npm-audit-report.json || true

    - name: Generate Security Summary
      working-directory: ./frontend
      run: |
        echo "# 📊 Security Scan Report" > security-reports/security-summary.md
        echo "Generated on: $(date)" >> security-reports/security-summary.md
        echo "" >> security-reports/security-summary.md
        echo "## NPM Audit Results" >> security-reports/security-summary.md
        if [ -f "security-reports/npm-audit-report.json" ]; then
          VULNS=$(node -e "try { const data = JSON.parse(require('fs').readFileSync('security-reports/npm-audit-report.json', 'utf8')); console.log(data.metadata ? data.metadata.vulnerabilities.total : 0); } catch(e) { console.log(0); }")
          echo "- Total vulnerabilities: $VULNS" >> security-reports/security-summary.md
          if [ "$VULNS" -gt 0 ]; then
            echo "- Status: ❌ ISSUES FOUND" >> security-reports/security-summary.md
          else
            echo "- Status: ✅ SECURE" >> security-reports/security-summary.md
          fi
        else
          echo "- Status: ❌ REPORT GENERATION FAILED" >> security-reports/security-summary.md
        fi

    - name: Upload Security Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-report
        path: frontend/security-reports/
        retention-days: 30

    - name: Check for High Severity Vulnerabilities
      working-directory: ./frontend
      run: |
        echo "🔍 Checking for high severity vulnerabilities..."
        # Fail on high/critical vulnerabilities only
        npm audit --audit-level high